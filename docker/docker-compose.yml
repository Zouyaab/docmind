# DocMind application stack (not infrastructure-as-code).
#
# Default: api + Postgres/pgvector (persistent mode when DATABASE_URL is set).
# Optional:
#   --profile ollama → local Ollama for live inference (set AI_PROVIDER=ollama)

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: docmind-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "3000"
      LOG_LEVEL: "info"
      MAX_UPLOAD_BYTES: "10485760"
      API_TOKEN: ""
      AI_PROVIDER: "mock"
      EMBEDDING_PROVIDER: "mock"
      EMBEDDING_DIMENSIONS: "32"
      DATABASE_URL: "postgres://docmind:docmind@postgres:5432/docmind"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.2"
      OLLAMA_EMBED_MODEL: "nomic-embed-text"
      OLLAMA_TIMEOUT_MS: "30000"
      OLLAMA_RETRIES: "1"
      RAG_MIN_SCORE: "0.12"
    volumes:
      - docmind-data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - docmind

  postgres:
    image: pgvector/pgvector:pg16
    container_name: docmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind
      POSTGRES_DB: docmind
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind -d docmind"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - docmind
    ports:
      - "5432:5432"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    container_name: docmind-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - docmind

volumes:
  docmind-data:
  pg-data:
  ollama-data:

networks:
  docmind:
    driver: bridge
